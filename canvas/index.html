<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Workflow Board</title><link rel="icon" href="data:,">
<style>
:root{--bg:#f4f5f7;--panel:#fff;--ink:#1c2230;--mut:#6b7385;--line:#d5d9e2;--grid:#e3e6ec;--edge:#7b8499;--sel:#2f6bff;--card:#fff;--pd:11px;--palw:220px;--inspw:280px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12151c;--panel:#1b1f29;--ink:#e6e9f0;--mut:#8f98ab;--line:#2c3240;--grid:#1d222d;--edge:#6d778d;--sel:#6b98ff;--card:#222836}}
:root[data-theme=dark]{--bg:#12151c;--panel:#1b1f29;--ink:#e6e9f0;--mut:#8f98ab;--line:#2c3240;--grid:#1d222d;--edge:#6d778d;--sel:#6b98ff;--card:#222836}
*{box-sizing:border-box}html,body{margin:0;height:100%;overscroll-behavior:none;-webkit-text-size-adjust:100%;background:var(--bg);color:var(--ink);font:13px/1.4 system-ui,Segoe UI,sans-serif}
#app{position:relative;display:grid;grid-template-columns:var(--palw) 1fr var(--inspw);grid-template-rows:44px 1fr;height:100%}
#app.palc{--palw:0px}#app.inspc{--inspw:0px}#app.palc #pal,#app.inspc #insp{display:none}
.rz{position:absolute;top:44px;bottom:0;width:7px;z-index:7;cursor:col-resize;touch-action:none}.rz:hover,.rz.on{background:var(--sel);opacity:.45}
#hPal{left:calc(var(--palw) - 4px)}#hInsp{right:calc(var(--inspw) - 4px)}#app.palc #hPal,#app.inspc #hInsp{display:none}
#bColL,#bColR{padding:4px 7px}#legend{display:none;position:fixed;left:calc(var(--palw) + 10px);bottom:10px;z-index:6;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;box-shadow:0 2px 10px #0004;font-size:12px}
#legend.open{display:block}#legend div{display:flex;align-items:center;gap:8px;margin:3px 0}#legend i{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:22px;height:18px;border-radius:4px;border:1px solid var(--line)}
.crow{display:flex;gap:6px;align-items:center}.crow input[type=color]{width:44px;height:28px;padding:0}.frow{margin-bottom:6px}.frow label{margin:4px 0 2px!important}.frow button{margin-top:3px;font-size:11px;padding:1px 8px}
.fadd{display:grid;grid-template-columns:1fr auto;gap:4px;margin-top:6px}.fadd input{grid-column:1/3}
#bar{grid-column:1/4;display:flex;gap:8px;align-items:center;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line)}
#bar b{margin-right:6px}#bar{overflow-x:auto;scrollbar-width:thin}#bar>*{flex-shrink:0}#bar>#msg{flex-shrink:1}#bDeployHelp{padding:4px 8px;border-radius:50%}
@media (max-width:1799px){#bar b{display:none}#bar{gap:4px;padding:0 8px}#bar button{padding:4px 6px}#picker{max-width:130px}#v4Tb{gap:4px!important}}button,select,input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
button{cursor:pointer}button:hover{border-color:var(--sel)}button.pri{background:var(--sel);color:#fff;border-color:var(--sel)}
#msg{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}#msg.err{color:#e5484d}#msg.ok{color:#2e9d5b}
#pal{background:var(--panel);border-right:1px solid var(--line);padding:8px;overflow:auto}#pal h4,#insp h4{margin:4px 0 8px;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.pi small{color:var(--mut)}.pi{display:flex;align-items:center;gap:8px;padding:6px 8px;margin-bottom:6px;border:1px solid var(--line);border-radius:6px;cursor:pointer;background:var(--card)}
.pi i,.hd i{font-style:normal;width:18px;text-align:center}.li small{white-space:normal;word-break:normal;overflow-wrap:anywhere}.li b{overflow-wrap:anywhere}
#pal input{width:100%;margin-bottom:8px}
#vp{position:relative;overflow:hidden;overflow:clip;cursor:grab;touch-action:none;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px)}
#vp.pan{cursor:grabbing}#world{position:absolute;left:0;top:0;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#edges path.e{fill:none;stroke:var(--edge);stroke-width:1.75;stroke-linejoin:round;pointer-events:stroke;cursor:pointer}#edges path.e:hover,#edges path.hl{stroke:var(--sel);stroke-width:2.5}#edges path.sel{stroke:var(--sel);stroke-width:3}#edges path.tmp{fill:none;stroke:var(--edge);stroke-width:2}#edges path.tmp{stroke-dasharray:5 4;pointer-events:none}
.card{--tc:#7A8396;--tx:#fff;cursor:move;position:absolute;width:192px;background:color-mix(in srgb,var(--tc) 9%,var(--card));border:2px solid var(--tc);border-radius:8px;box-shadow:0 1px 3px #0003;user-select:none}
.card.sel{outline:2px solid var(--sel)}.card.grey{opacity:.45;filter:grayscale(1)}.card.off{opacity:.6}
.card,.hd{touch-action:none;-webkit-touch-callout:none}.hd{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:5px 5px 0 0;background:var(--tc);color:var(--tx);font-weight:600;cursor:move;height:30px}
.hd span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hd small{opacity:.85;font-weight:400}
.row{display:flex;justify-content:space-between;height:20px;font-size:11px;color:var(--mut)}
.pt{position:relative;padding:0 12px;white-space:nowrap}
.pt::before{content:"";box-sizing:border-box;position:absolute;top:calc(50% - var(--pd)/2);width:var(--pd);height:var(--pd);border-radius:50%;background:var(--card);border:2px solid var(--edge)}
.pt.in::before{left:calc(var(--pd)/-2)}.pt.out::before{right:calc(var(--pd)/-2)}.pt.out{text-align:right;cursor:crosshair}.pt:hover::before{border-color:var(--sel);background:var(--sel)}
.ft{font-size:10px;color:var(--mut);padding:2px 8px 4px;border-top:1px solid var(--line);display:flex;justify-content:space-between}
.t-step .hd{height:auto;min-height:30px;padding:4px 8px}.t-step .hd span{white-space:normal;overflow:visible}.grp{position:absolute;border:1.5px dashed var(--edge);border-radius:12px;background:#7b849910;pointer-events:none}.grp b{position:absolute;left:12px;top:-10px;padding:0 8px;background:var(--bg);color:var(--mut);font-size:12px;letter-spacing:.04em}
.grp.tinted{border-color:var(--gc);background:color-mix(in srgb,var(--gc) 10%,transparent)}.grp.tinted b{background:var(--gc);color:var(--gx);border-radius:4px;top:-12px;padding:1px 9px;font-weight:600}
#insp{background:var(--panel);border-left:1px solid var(--line);padding:10px;overflow:auto}
#insp label{display:block;margin:8px 0 2px;color:var(--mut);font-size:11px}#insp input,#insp select,#insp textarea{width:100%}#insp textarea{min-height:90px;font-family:ui-monospace,Consolas,monospace;font-size:12px}
#bPal,#bInsp{display:none}
@media (max-width:699px){#app,#app.palc,#app.inspc{grid-template-columns:1fr;grid-template-rows:44px 1fr}.rz,#bColL,#bColR,#legend{display:none!important}#app.palc #pal,#app.inspc #insp{display:none}#bar{grid-column:1;overflow-x:auto;gap:6px;padding:0 8px}#bar b{display:none}#bPal,#bInsp{display:inline-block}#picker{max-width:110px}#msg{display:none}
 #vp{grid-column:1;grid-row:2}#pal,#insp{display:none;position:fixed;top:44px;bottom:0;z-index:8;width:min(280px,85vw);box-shadow:0 4px 16px #0005}#pal{left:0}#insp{right:0}#app.palopen #pal,#app.inspopen #insp{display:block}#dep{right:8px!important}button,select,input,textarea{font-size:16px}}
#dep{display:none;position:fixed;right:300px;top:50px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;z-index:9;box-shadow:0 4px 16px #0004}#dep code{display:block;margin:6px 0;padding:6px 8px;background:var(--bg);border-radius:4px;user-select:all}
</style></head><body>
<div id="app">
 <div id="bar"><b>Workflow Board</b><select id="picker" title="Board"></select><button id="bSave" class="pri">Save</button><button id="bDeploy" title="Deploy = the agent starts following this board's behaviour. This page only shows the command; it never deploys by itself.">Deploy request</button><button id="bDeployHelp" type="button" title="What does Deploy mean?" aria-label="What does Deploy mean?">?</button><button id="bFit">Fit</button><button id="bPal">Add</button><button id="bInsp">Inspect</button><button id="bColL" title="Collapse / expand the left panel">&#9664; Left</button><button id="bColR" title="Collapse / expand the inspector">Right &#9654;</button><button id="bLegend" title="Show colour legend">Legend</button><span id="tkPill" title="Pending tickets">tickets: 0 pending</span><span id="msg"></span></div>
 <div id="pal"><h4>Add card</h4><input id="pref" placeholder="ref (name / event / file)"><div id="palList"></div><h4 style="margin-top:14px">Keys</h4><div style="color:var(--mut);font-size:11px">Drag header: move<br>Drag out-port to in-port: connect<br>Click edge / card + Delete: remove<br>Wheel: zoom, drag empty: pan</div></div>
 <div id="hPal" class="rz" title="Drag to resize the left panel"></div><div id="hInsp" class="rz" title="Drag to resize the inspector"></div>
 <div id="vp"><div id="world"><div id="groups"></div><svg id="edges"><defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="context-stroke" stroke="none"/></marker></defs></svg><div id="cards"></div></div></div>
 <div id="insp"><h4>Inspector</h4><div id="inspBody" style="color:var(--mut)">Select a card.</div></div>
</div>
<div id="legend"></div><div id="dep"></div>
<script type="module" src="/canvas/js/core.js"></script><script type="module" src="/canvas/js/arrange.js"></script><script type="module" src="/canvas/js/select.js"></script><script type="module" src="/canvas/js/library.js"></script><script type="module" src="/canvas/js/inspector.js"></script><script type="module" src="/canvas/js/panels.js"></script><script type="module" src="/canvas/js/tickets.js"></script><script type="module" src="/canvas/js/zoom.js"></script><script type="module" src="/canvas/js/kinds.js"></script><script type="module" src="/canvas/js/shared.js"></script><script type="module" src="/canvas/js/autosave.js"></script>
<script type="module" src="/canvas/js/phonebar.js"></script>
<script type="module">/* v4 loader: kinds.js is static above (card kinds must exist before the first render). The remaining v4 modules (containers, runs, history, dirty, collapse, tidy, toolbar) load only if the server reports them on disk, so an absent module is never a 404 console error. */
try{const r=await fetch("/v4/modules");const j=r.ok?await r.json():{modules:[]};for(const m of(j.modules||[]))if(m!=="kinds")import("/canvas/js/"+m+".js").catch(e=>console.warn("v4 module "+m+" failed: "+e))}catch(e){console.warn("v4 loader: "+e)}</script></body></html>
